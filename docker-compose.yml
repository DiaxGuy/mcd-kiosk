version: '3.8'

services:
  mcdonalds-kiosk:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - coolify
      - default

networks:
  default:
  coolify:
    name: coolify
    external: true
